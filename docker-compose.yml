version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lendloop-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Jakarta
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-lendloop_secure_n8n_key_32chars_min}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - LENDLOOP_WEBHOOK_SECRET=${LENDLOOP_WEBHOOK_SECRET:-lendloop_shared_hmac_secret_2026}
      - CONVEX_SITE_URL=${CONVEX_SITE_URL:-http://localhost:3000}
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,buffer
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    name: lendloop_n8n_data
